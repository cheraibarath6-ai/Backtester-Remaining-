name: Funding Notional Audit Tests

on:
  push:
    branches: [research/funding-notional-audit]
    paths:
      - "crypto_research/backtest.py"
      - "tests/test_backtest.py"
      - ".github/workflows/funding-audit-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run full regression suite
        run: python -m compileall -q crypto_research tests && python -m pytest -q
