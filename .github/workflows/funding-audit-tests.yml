name: Funding Notional Audit Tests

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/backtest.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/sensitivity_run.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_backtest.py"
      - "tests/test_sensitivity.py"
      - "tests/test_aggregate_independent.py"
      - "tests/test_cost_stress.py"
      - "tests/test_combinations.py"
      - "tests/test_walkforward.py"
      - ".github/workflows/funding-audit-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "crypto_research/backtest.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/sensitivity_run.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_backtest.py"
      - "tests/test_sensitivity.py"
      - "tests/test_aggregate_independent.py"
      - "tests/test_cost_stress.py"
      - "tests/test_combinations.py"
      - "tests/test_walkforward.py"
      - ".github/workflows/funding-audit-tests.yml"

permissions:
  contents: read

concurrency:
  group: funding-notional-audit-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run full regression suite
        run: python -m compileall -q crypto_research tests && python -m pytest -q
