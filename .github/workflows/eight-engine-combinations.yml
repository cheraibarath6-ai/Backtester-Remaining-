name: Independent Eight-Engine Within-Model Combination Research

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/eight_engine_combination_run.py"
      - ".github/workflows/eight-engine-combinations.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: independent-eight-engine-combinations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Combination research / ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run evidence-led independent combinations
        run: >
          python -m crypto_research.eight_engine_combination_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --models M6 M8 M15
          --timeframes 4h
          --fee-bps 5
          --slippage-bps 2
          --out combination_artifacts
      - name: Upload symbol combination results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-combination-${{ matrix.symbol }}
          path: combination_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate within-model combination results
    runs-on: ubuntu-latest
    needs: sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eight-engine-combination-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate independent model results
        run: python -m crypto_research.aggregate_independent --input input-artifacts --out combination_results
      - name: Upload combined combination report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-combination-results
          path: combination_results/
          if-no-files-found: warn
          retention-days: 90
