name: DOGE asset-specific M6 M8 independent research

on:
  push:
    branches: [research/asset-oriented-independent-engine]
    paths:
      - "crypto_research/asset_engine_registry.py"
      - "crypto_research/eight_engine_walkforward_run.py"
      - ".github/workflows/doge-asset-research.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: doge-asset-independent-research
  cancel-in-progress: false

jobs:
  research:
    name: DOGE / ${{ matrix.timeframe }} / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        timeframe: ["1h", "4h"]
        model: [M6, M8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q crypto_research tests
          python -m pytest -q
      - name: Run DOGE model-specific expanding walk-forward
        run: >
          python -m crypto_research.eight_engine_walkforward_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol DOGEUSDT
          --timeframe "${{ matrix.timeframe }}"
          --models "${{ matrix.model }}"
          --test-years 2023 2024 2025 2026
          --min-train-trades 30
          --min-entry-retention-pct 80
          --min-count-retention-pct 80
          --fee-bps 5
          --slippage-bps 2
          --out doge_research_artifacts
      - name: Upload DOGE strategy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-independent-${{ matrix.model }}-${{ matrix.timeframe }}
          path: doge_research_artifacts/
          if-no-files-found: warn
          retention-days: 90
