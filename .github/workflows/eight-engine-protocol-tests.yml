name: Eight-Engine Protocol Regression Tests

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/eight_engine_walkforward_run.py"
      - "crypto_research/aggregate_eight_engine_walkforward.py"
      - "crypto_research/eight_engine_forward_holdout_run.py"
      - "crypto_research/aggregate_eight_engine_forward_holdout.py"
      - "tests/test_eight_engine_walkforward.py"
      - "tests/test_eight_engine_forward_holdout.py"
      - ".github/workflows/eight-engine-protocol-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile only the new in-scope runners
        run: |
          python -m compileall -q crypto_research/eight_engine_walkforward_run.py
          python -m compileall -q crypto_research/aggregate_eight_engine_walkforward.py
          python -m compileall -q crypto_research/eight_engine_forward_holdout_run.py
          python -m compileall -q crypto_research/aggregate_eight_engine_forward_holdout.py
      - name: Run only eight-engine protocol tests
        run: python -m pytest -q tests/test_eight_engine_walkforward.py tests/test_eight_engine_forward_holdout.py
