name: Resume HEAD batch 2 after artifact-download fix

on:
  push:
    branches:
      - research/funding-notional-audit-v2
    paths:
      - .github/workflows/head-batch2-resume.yml

permissions:
  actions: write
  contents: read

jobs:
  resume-batch-2:
    if: github.event.head_commit.message == 'Retry HEAD batch 2 dispatch with JSON content type'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the blocked 2022 batch again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: research/funding-notional-audit-v2
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/head-five-year.yml/dispatches" \
            --data '{"ref":"research/funding-notional-audit-v2","inputs":{"start":"2022-01-01","end":"2023-01-01"}}'
