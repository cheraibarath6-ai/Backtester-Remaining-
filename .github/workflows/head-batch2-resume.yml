name: Resume HEAD batch 2 after artifact-download fix

on:
  push:
    branches:
      - research/funding-notional-audit-v2
    paths:
      - .github/workflows/head-batch2-resume.yml

permissions:
  actions: write
  contents: read

jobs:
  resume-batch-2:
    if: github.event.head_commit.message == 'Diagnose HEAD batch 2 workflow-dispatch response'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and dispatch the blocked 2022 batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error \
            --output dispatch-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/head-five-year.yml/dispatches" \
            --data-raw '{"ref":"research/funding-notional-audit-v2","inputs":{"start":"2022-01-01","end":"2023-01-01"}}')
          echo "workflow_dispatch HTTP status: ${status}"
          cat dispatch-response.txt
          test "${status}" = "204"
