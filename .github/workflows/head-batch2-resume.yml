name: HEAD sequential annual batches — five frozen models
# Current stage marker: batch 4

on:
  push:
    branches:
      - research/funding-notional-audit-v2
    paths:
      - .github/workflows/head-batch2-resume.yml

permissions:
  contents: read
  actions: write

env:
  BATCH_START: ${{ github.event.head_commit.message == 'Run HEAD batch 1' && '2021-11-14' || github.event.head_commit.message == 'Run HEAD batch 2' && '2022-01-01' || github.event.head_commit.message == 'Run HEAD batch 3' && '2023-01-01' || github.event.head_commit.message == 'Run HEAD batch 4' && '2024-01-01' || github.event.head_commit.message == 'Run HEAD batch 5' && '2025-01-01' || github.event.head_commit.message == 'Run HEAD batch 6' && '2026-01-01' || github.event.head_commit.message == 'Aggregate HEAD batch 2' && '2022-01-01' }}
  BATCH_END: ${{ github.event.head_commit.message == 'Run HEAD batch 1' && '2022-01-01' || github.event.head_commit.message == 'Run HEAD batch 2' && '2023-01-01' || github.event.head_commit.message == 'Run HEAD batch 3' && '2024-01-01' || github.event.head_commit.message == 'Run HEAD batch 4' && '2025-01-01' || github.event.head_commit.message == 'Run HEAD batch 5' && '2026-01-01' || github.event.head_commit.message == 'Run HEAD batch 6' && '2026-11-14' || github.event.head_commit.message == 'Aggregate HEAD batch 2' && '2023-01-01' }}

concurrency:
  group: head-sequential-${{ github.ref }}-${{ github.event.head_commit.message }}
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event.head_commit.message == 'Run HEAD batch 1' || github.event.head_commit.message == 'Run HEAD batch 2' || github.event.head_commit.message == 'Run HEAD batch 3' || github.event.head_commit.message == 'Run HEAD batch 4' || github.event.head_commit.message == 'Run HEAD batch 5' || github.event.head_commit.message == 'Run HEAD batch 6'
    name: HEAD / ${{ matrix.symbol }} / 4h
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, LINKUSDT, LTCUSDT, AVAXUSDT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/funding-notional-audit-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test frozen HEAD OR logic
        run: |
          python -m compileall -q crypto_research/head_engine.py crypto_research/aggregate_head.py crypto_research/data.py
          python -m pytest -q tests/test_head_engine.py tests/test_data_months.py tests/test_improvement_run.py tests/test_aggregate_head.py
      - name: Run annual date batch with 130 completed 4h warmup bars
        run: >
          python -m crypto_research.head_engine
          --start "${{ env.BATCH_START }}"
          --end "${{ env.BATCH_END }}"
          --warmup-bars 130
          --symbol "${{ matrix.symbol }}"
          --fee-bps 5
          --slippage-bps 2
          --out head_artifacts
      - name: Upload per-symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-${{ env.BATCH_START }}-${{ env.BATCH_END }}-${{ matrix.symbol }}
          path: head_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Verify cumulative HEAD window
    runs-on: ubuntu-latest
    needs: backtest
    if: always() && (github.event.head_commit.message == 'Run HEAD batch 1' || github.event.head_commit.message == 'Run HEAD batch 2' || github.event.head_commit.message == 'Run HEAD batch 3' || github.event.head_commit.message == 'Run HEAD batch 4' || github.event.head_commit.message == 'Run HEAD batch 5' || github.event.head_commit.message == 'Run HEAD batch 6' || github.event.head_commit.message == 'Aggregate HEAD batch 2')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/funding-notional-audit-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test per-bar HEAD trigger attribution
        run: python -m pytest -q tests/test_aggregate_head.py
      - name: Download latest complete official HEAD artifacts from every successful batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BATCH_START: ${{ env.BATCH_START }}
          BATCH_END: ${{ env.BATCH_END }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = f"https://api.github.com/repos/{repo}"
          symbols = {
              "BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT",
              "DOGEUSDT", "ADAUSDT", "LINKUSDT", "LTCUSDT", "AVAXUSDT",
          }
          allowed_paths = {
              ".github/workflows/head-five-year.yml",
              ".github/workflows/head-batch2-resume.yml",
          }
          name_re = re.compile(
              r"^head-(\d{4}-\d{2}-\d{2})-(\d{4}-\d{2}-\d{2})-([A-Z0-9]+)$"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              return response.json()

          runs = []
          page = 1
          while True:
              query = urllib.parse.urlencode({
                  "branch": branch, "per_page": 100, "page": page
              })
              items = get_json(f"{api}/actions/runs?{query}").get("workflow_runs", [])
              runs.extend(items)
              if len(items) < 100:
                  break
              page += 1
          run_by_id = {int(run["id"]): run for run in runs}
          run_by_id.setdefault(current_run, {
              "id": current_run, "head_branch": branch,
              "path": ".github/workflows/head-batch2-resume.yml",
              "conclusion": None, "status": "in_progress",
              "created_at": "9999-12-31T23:59:59Z",
          })

          artifacts = []
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              items = get_json(f"{api}/actions/artifacts?{query}").get("artifacts", [])
              artifacts.extend(items)
              if len(items) < 100:
                  break
              page += 1

          grouped = {}
          for artifact in artifacts:
              if artifact.get("expired"):
                  continue
              match = name_re.match(artifact.get("name", ""))
              if not match or match.group(3) not in symbols:
                  continue
              run_info = artifact.get("workflow_run") or {}
              run_id = int(run_info.get("id", -1))
              run = run_by_id.get(run_id)
              if not run or run.get("head_branch") != branch:
                  continue
              if run.get("path") not in allowed_paths:
                  continue
              start, end, symbol = match.groups()
              # Ignore later completed batches when rebuilding an earlier window.
              if end > os.environ["BATCH_END"]:
                  continue
              grouped.setdefault((start, end, run_id), {})[symbol] = artifact

          candidates_by_batch = {}
          for (start, end, run_id), symbol_artifacts in grouped.items():
              run = run_by_id[run_id]
              complete = set(symbol_artifacts) == symbols
              is_current = run_id == current_run
              if complete and (is_current or run.get("conclusion") == "success"):
                  candidates_by_batch.setdefault((start, end), []).append(
                      (run.get("created_at", ""), run_id, symbol_artifacts)
                  )

          root = Path("input-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          chosen_count = 0
          for batch, candidates in sorted(candidates_by_batch.items()):
              _, run_id, symbol_artifacts = max(candidates, key=lambda item: item[0])
              for symbol, artifact in sorted(symbol_artifacts.items()):
                  api_response = requests.get(
                      artifact["archive_download_url"],
                      headers=headers,
                      allow_redirects=False,
                      timeout=60,
                  )
                  if api_response.is_redirect:
                      signed_url = api_response.headers.get("Location")
                      if not signed_url:
                          raise RuntimeError(
                              f"Artifact {artifact['name']} redirect has no Location"
                          )
                      download_response = requests.get(
                          signed_url, timeout=180, allow_redirects=True
                      )
                  else:
                      download_response = api_response
                  download_response.raise_for_status()
                  archive_bytes = download_response.content
                  destination = root / f"{batch[0]}_{batch[1]}" / symbol
                  destination.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                      for member in archive.infolist():
                          member_path = Path(member.filename)
                          if member_path.is_absolute() or ".." in member_path.parts:
                              raise RuntimeError(
                                  f"Unsafe artifact member path: {member.filename}"
                              )
                          archive.extract(member, destination)
                  chosen_count += 1
              print(
                  f"Selected complete batch {batch[0]}..{batch[1]} from run {run_id}"
              )

          print(
              f"Downloaded {chosen_count} per-symbol artifacts across "
              f"{len(candidates_by_batch)} complete batches"
          )
          PY
      - name: Aggregate and verify contiguous cumulative window
        run: >
          python -m crypto_research.aggregate_head
          --input input-artifacts
          --out head_results
          --expected-start "2021-11-14"
          --expected-end "${{ env.BATCH_END }}"
          --current-start "${{ env.BATCH_START }}"
          --current-end "${{ env.BATCH_END }}"
      - name: Upload cumulative HEAD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-2021-11-14-${{ env.BATCH_END }}-cumulative-top10-results
          path: head_results/
          if-no-files-found: warn
          retention-days: 90
