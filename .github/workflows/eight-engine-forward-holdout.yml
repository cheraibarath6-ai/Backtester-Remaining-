name: Frozen Eight-Engine Forward Holdout

on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: Exclusive UTC date; leave blank to use today's UTC date
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: frozen-eight-engine-forward-holdout
  cancel-in-progress: false

jobs:
  score:
    name: Forward holdout / ${{ matrix.symbol }} / ${{ matrix.timeframe }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, ADAUSDT, DOGEUSDT, SOLUSDT, XRPUSDT]
        timeframe: ["1h", "4h"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test frozen holdout protocol
        run: |
          python -m compileall -q crypto_research/eight_engine_forward_holdout_run.py crypto_research/aggregate_eight_engine_forward_holdout.py
          python -m pytest -q tests/test_eight_engine_forward_holdout.py
      - name: Resolve last fully completed UTC day
        id: window
        shell: bash
        run: |
          END_DATE="${{ inputs.end_date }}"
          if [ -z "$END_DATE" ]; then END_DATE="$(date -u +%F)"; fi
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Holdout window: 2026-11-01 <= entry < $END_DATE"
      - name: Run frozen independent forward holdout
        run: >
          python -m crypto_research.eight_engine_forward_holdout_run
          --start "2021-01-01"
          --holdout-start "2026-11-01"
          --end "${{ steps.window.outputs.end_date }}"
          --symbol "${{ matrix.symbol }}"
          --timeframe "${{ matrix.timeframe }}"
          --fee-bps 5
          --slippage-bps 2
          --minimum-candle-coverage-pct 99.5
          --out eight_engine_forward_holdout_artifacts
      - name: Upload symbol forward holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-forward-holdout-${{ matrix.symbol }}-${{ matrix.timeframe }}
          path: eight_engine_forward_holdout_artifacts/
          if-no-files-found: warn
          retention-days: 180

  aggregate:
    name: Aggregate frozen forward holdout
    runs-on: ubuntu-latest
    needs: score
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eight-engine-forward-holdout-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate frozen forward holdout
        run: >
          python -m crypto_research.aggregate_eight_engine_forward_holdout
          --input input-artifacts
          --out eight_engine_forward_holdout_results
      - name: Upload combined holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-forward-holdout-results
          path: eight_engine_forward_holdout_results/
          if-no-files-found: warn
          retention-days: 180
