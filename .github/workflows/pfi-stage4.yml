name: PFI Stage 4 — Joint Profile Validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pfi-stage4.yml"
      - "crypto_research/pfi_stage4.py"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-13"
permissions:
  contents: read
  actions: read
concurrency:
  group: pfi-stage4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pfi:
    name: PFI Stage 4 / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [M1, M2, M4, M5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run joint profile validation
        run: >
          python -m crypto_research.pfi_stage4
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-13' }}"
          --symbols BTCUSDT ETHUSDT
          --timeframes 5m 15m
          --model "${{ matrix.model }}"
          --fee-bps 5 --slippage-bps 2 --rr 2
          --out pfi_stage4_artifacts
      - name: Upload PFI Stage 4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfi-stage4-${{ matrix.model }}
          path: pfi_stage4_artifacts/
          if-no-files-found: warn
          retention-days: 90
  five-minute-watch:
    name: PFI Stage 4 Five-Minute Watch
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check all four model jobs every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ["GH_REPOSITORY"]
          run_id=os.environ["GH_RUN_ID"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          expected={"PFI Stage 4 / M1","PFI Stage 4 / M2","PFI Stage 4 / M4","PFI Stage 4 / M5"}
          while True:
              req=urllib.request.Request(url,headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  jobs=json.load(response).get("jobs",[])
              selected=[j for j in jobs if j.get("name") in expected]
              print("FIVE-MINUTE WATCH:",flush=True)
              for job in sorted(selected,key=lambda x:x.get("name","")):
                  print(f'{job.get("name")}: {job.get("status")} / {job.get("conclusion")}',flush=True)
              if len(selected)==4 and all(j.get("status")=="completed" for j in selected):
                  print("All four model jobs reached terminal status. Watch complete.",flush=True)
                  break
              print("Next status check in five minutes.",flush=True)
              time.sleep(300)
          PY
