name: Independent Core Engine Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-discovery.yml"
      - "crypto_research/backtest.py"
      - "crypto_research/data.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/independent_run.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_backtest.py"
      - "tests/test_independent_models.py"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: independent-core-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    name: Independent screen / ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run offline tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run independent model baselines
        run: >
          python -m crypto_research.independent_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --models M1 M2 M4 M5 M6 M7 M8 M9 M10 M11 M12 M13 M14 M15
          --timeframes 5m 15m 1h 4h
          --fee-bps 5
          --slippage-bps 2
          --rr 2
          --max-hold-hours 24
          --out independent_screen_artifacts
      - name: Upload symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-screen-${{ matrix.symbol }}
          path: independent_screen_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate independent model results
    runs-on: ubuntu-latest
    needs: screen
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: independent-screen-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate available results
        run: python -m crypto_research.aggregate_independent --input input-artifacts --out independent_engine_results
      - name: Upload combined research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-engine-screening-results
          path: independent_engine_results/
          if-no-files-found: warn
          retention-days: 90
