name: HEAD Batch Chain Kickoff

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - ".github/workflows/head-kickoff.yml"

permissions:
  actions: write

jobs:
  kickoff:
    if: github.event.head_commit.message == 'Kick off HEAD batch chain'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the first remaining annual batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: research/funding-notional-audit-v2
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/head-five-year.yml/dispatches" \
            --data "{\"ref\":\"${TARGET_REF}\",\"inputs\":{\"start\":\"2022-01-01\",\"end\":\"2023-01-01\"}}"
