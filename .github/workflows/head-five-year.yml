name: HEAD Five-Model OR Engine — 5Y Top-10 Futures Backtest
on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/data.py"
      - "crypto_research/funding_patch.py"
      - "crypto_research/head_engine.py"
      - "crypto_research/data.py"
      - "crypto_research/funding_patch.py"
      - "crypto_research/aggregate_head.py"
      - "tests/test_head_engine.py"
      - ".github/workflows/head-five-year.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-11-14"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-14"
permissions:
  contents: read
concurrency:
  group: head-five-year-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    name: HEAD / ${{ matrix.symbol }} / 4h
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, LINKUSDT, LTCUSDT, AVAXUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test HEAD OR logic
        run: |
          python -m compileall -q crypto_research/head_engine.py crypto_research/aggregate_head.py
          python -m pytest -q tests/test_head_engine.py tests/test_data_months.py tests/test_improvement_run.py
      - name: Run five-year HEAD backtest
        run: >
          python -m crypto_research.head_engine
          --start "${{ inputs.start || '2021-11-14' }}"
          --end "${{ inputs.end || '2026-11-14' }}"
          --symbol "${{ matrix.symbol }}"
          --fee-bps 5
          --slippage-bps 2
          --out head_artifacts
      - name: Upload per-symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-five-year-${{ matrix.symbol }}
          path: head_artifacts/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    name: Aggregate HEAD ten-asset results
    runs-on: ubuntu-latest
    needs: backtest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: head-five-year-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate and verify all ten symbols
        run: >
          python -m crypto_research.aggregate_head
          --input input-artifacts
          --out head_results
      - name: Upload final HEAD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-five-year-top10-results
          path: head_results/
          if-no-files-found: warn
          retention-days: 90
