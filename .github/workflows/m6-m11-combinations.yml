name: Independent M6-M11 Combination Research

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - ".github/workflows/m6-m11-combinations.yml"
      - "crypto_research/combination_run.py"
      - "crypto_research/backtest.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_combinations.py"
      - "crypto_research/walkforward_run.py"
      - "crypto_research/aggregate_walkforward.py"
      - "tests/test_walkforward.py"
      - ".github/workflows/m6-m11-walkforward.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m6-m11-combinations.yml"
      - "crypto_research/combination_run.py"
      - "crypto_research/backtest.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_combinations.py"
      - "crypto_research/walkforward_run.py"
      - "crypto_research/aggregate_walkforward.py"
      - "tests/test_walkforward.py"
      - ".github/workflows/m6-m11-walkforward.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: independent-m6-m11-combinations-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  combinations:
    name: M6/M11 combinations / ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run independent within-model combinations
        run: >
          python -m crypto_research.combination_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --models M6 M11
          --timeframe 4h
          --fee-bps 5
          --slippage-bps 2
          --out combination_artifacts
      - name: Upload symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combinations-${{ matrix.symbol }}
          path: combination_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate M6/M11 combinations
    runs-on: ubuntu-latest
    needs: combinations
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: combinations-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate independent variants
        run: python -m crypto_research.aggregate_independent --input input-artifacts --out combination_results
      - name: Upload combined research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-m6-m11-combination-results
          path: combination_results/
          if-no-files-found: warn
          retention-days: 90


  walkforward:
    name: Expanding walk-forward / ${{ matrix.symbol }}
    needs: combinations
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run independent expanding-window M6/M11 walk-forward
        run: >
          python -m crypto_research.walkforward_run
          --start "2021-01-01"
          --end "2026-11-01"
          --symbol "${{ matrix.symbol }}"
          --timeframe 4h
          --test-years 2023 2024 2025 2026
          --min-train-trades 10
          --out walkforward_artifacts
      - name: Upload walk-forward symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-${{ matrix.symbol }}
          path: walkforward_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate_walkforward:
    name: Aggregate expanding walk-forward
    if: always()
    needs: walkforward
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download walk-forward symbol artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: walkforward-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate independent symbol streams
        run: python -m crypto_research.aggregate_walkforward --input input-artifacts --out walkforward_results
      - name: Upload combined walk-forward report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-m6-m11-walkforward-results
          path: walkforward_results/
          if-no-files-found: warn
          retention-days: 90
