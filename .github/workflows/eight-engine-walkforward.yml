name: Independent Eight-Engine Retention-Gated Walk-Forward

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/eight_engine_walkforward_run.py"
      - "crypto_research/aggregate_eight_engine_walkforward.py"
      - "tests/test_eight_engine_walkforward.py"
      - ".github/workflows/eight-engine-walkforward.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: independent-eight-engine-walkforward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Walk-forward / ${{ matrix.symbol }} / ${{ matrix.timeframe }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, ADAUSDT, DOGEUSDT, SOLUSDT, XRPUSDT]
        timeframe: ["1h", "4h"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scoped runner and run scoped regression tests
        run: |
          python -m compileall -q crypto_research/eight_engine_walkforward_run.py crypto_research/aggregate_eight_engine_walkforward.py
          python -m pytest -q tests/test_eight_engine_walkforward.py
      - name: Run independent retention-gated walk-forward
        run: >
          python -m crypto_research.eight_engine_walkforward_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --timeframe "${{ matrix.timeframe }}"
          --models M6 M7 M8 M10 M12 M13 M14 M15
          --test-years 2023 2024 2025 2026
          --min-train-trades 30
          --min-entry-retention-pct 80
          --min-count-retention-pct 80
          --fee-bps 5
          --slippage-bps 2
          --out eight_engine_walkforward_artifacts
      - name: Upload symbol walk-forward results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-walkforward-${{ matrix.symbol }}-${{ matrix.timeframe }}
          path: eight_engine_walkforward_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate independent walk-forward results
    runs-on: ubuntu-latest
    needs: sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eight-engine-walkforward-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate independent walk-forward results
        run: >
          python -m crypto_research.aggregate_eight_engine_walkforward
          --input input-artifacts
          --out eight_engine_walkforward_results
      - name: Upload combined walk-forward report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-walkforward-results
          path: eight_engine_walkforward_results/
          if-no-files-found: warn
          retention-days: 90
