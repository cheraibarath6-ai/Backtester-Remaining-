name: Independent Eight-Engine Cost-Aware Improvement Research

on:
  push:
    branches: [research/funding-notional-audit-v2]
    paths:
      - "crypto_research/backtest.py"
      - "crypto_research/data.py"
      - "crypto_research/metrics.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/improvement_run.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_backtest.py"
      - "tests/test_independent_models.py"
      - "tests/test_aggregate_independent.py"
      - ".github/workflows/m6-m11-sensitivity.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

# Keep the prior concurrency key so this scoped run supersedes any older M6/M11 sensitivity job.
concurrency:
  group: independent-m6-m11-sensitivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Eight-engine improvement / ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run selected independent model improvements
        run: >
          python -m crypto_research.improvement_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --models M6 M7 M8 M10 M12 M13 M14 M15
          --timeframes 15m 1h 4h
          --fee-bps 5
          --slippage-bps 2
          --out improvement_artifacts
      - name: Upload symbol improvement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improvement-${{ matrix.symbol }}
          path: improvement_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate selected-engine improvement results
    runs-on: ubuntu-latest
    needs: sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: improvement-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate selected independent model results
        run: python -m crypto_research.aggregate_independent --input input-artifacts --out improvement_results
      - name: Upload combined improvement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-engine-improvement-results
          path: improvement_results/
          if-no-files-found: warn
          retention-days: 90
