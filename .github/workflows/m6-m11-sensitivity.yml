name: Independent M6-M11 Sensitivity

on:
  push:
    branches: [research/funding-notional-audit]
    paths:
      - "crypto_research/backtest.py"
      - "crypto_research/independent_models.py"
      - "crypto_research/sensitivity_run.py"
      - "crypto_research/aggregate_independent.py"
      - "tests/test_backtest.py"
      - "tests/test_sensitivity.py"
      - "tests/test_aggregate_independent.py"
      - ".github/workflows/m6-m11-sensitivity.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start date
        required: true
        default: "2021-01-01"
      end:
        description: Exclusive UTC end date
        required: true
        default: "2026-11-01"

permissions:
  contents: read

concurrency:
  group: independent-m6-m11-sensitivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: M6/M11 sensitivity / ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, ADAUSDT, DOGEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regression tests
        run: python -m compileall -q crypto_research tests && python -m pytest -q
      - name: Run independent one-factor-at-a-time sweeps
        run: >
          python -m crypto_research.sensitivity_run
          --start "${{ inputs.start || '2021-01-01' }}"
          --end "${{ inputs.end || '2026-11-01' }}"
          --symbol "${{ matrix.symbol }}"
          --models M6 M11
          --timeframes 1h 4h
          --fee-bps 5
          --slippage-bps 2
          --out sensitivity_artifacts
      - name: Upload symbol sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitivity-${{ matrix.symbol }}
          path: sensitivity_artifacts/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate M6/M11 sensitivity
    runs-on: ubuntu-latest
    needs: sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download completed symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sensitivity-*
          path: input-artifacts
          merge-multiple: false
      - name: Aggregate independent variants
        run: python -m crypto_research.aggregate_independent --input input-artifacts --out sensitivity_results
      - name: Upload combined sensitivity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-m6-m11-sensitivity-results
          path: sensitivity_results/
          if-no-files-found: warn
          retention-days: 90
